name: Build and Deploy Agda HTML

on:
  push:
    paths:
      - "Agda/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Agda
        uses: agda/agda-setup-action@v1
        with:
          agda-version: "2.8.0"

      - name: Install and register Agda standard library
        run: |
          set -euo pipefail
          STDLIB_VERSION="2.4"
          mkdir -p "$HOME/.agda" "$HOME/.cache/agda-stdlib"
          curl -fsSL "https://github.com/agda/agda-stdlib/archive/refs/tags/v${STDLIB_VERSION}.tar.gz" \
            -o "$HOME/.cache/agda-stdlib/stdlib.tar.gz"
          tar -xzf "$HOME/.cache/agda-stdlib/stdlib.tar.gz" -C "$HOME/.cache/agda-stdlib"
          STDLIB_DIR="$HOME/.cache/agda-stdlib/agda-stdlib-${STDLIB_VERSION}"
          printf '%s\n' "${STDLIB_DIR}/standard-library.agda-lib" > "$HOME/.agda/libraries"

      - name: Generate Agda HTML documentation
        working-directory: Agda
        run: |
          agda --html Rome/All.agda
          touch html/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Agda/html

  deploy-pages:
    needs: build-html
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4